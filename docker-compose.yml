version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: guardian_backend
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=GUARDIAN
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:///./guardian.db
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - guardian_data:/app

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: guardian_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  guardian_data:
